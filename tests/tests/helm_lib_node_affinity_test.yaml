suite: helm_lib_node_affinity definition
templates:
  - helm_lib_node_affinity.yaml
tests:
  - it: should return not empty string in case of Cloud cluster
    set:
      global:
        clusterConfiguration:
          clusterType: "Cloud"

    asserts:
      - equal:
          path: "test"
          value: "not empty string"

  - it: should return not empty string in case of Static cluster with one of cloud-provider enabled
    set:
      global:
        clusterConfiguration:
          clusterType: "Static"
        enabledModules:
        - cloud-provider-aws

    asserts:
      - equal:
          path: "test"
          value: "not empty string"

  - it: should return not empty string in case of Static cluster with infra-provider-baremetal enabled
    set:
      global:
        clusterConfiguration:
          clusterType: "Static"
        enabledModules:
        - infra-provider-baremetal

    asserts:
      - equal:
          path: "test"
          value: "not empty string"

  - it: should return not empty string in case of Static cluster with any infra-provider-* enabled
    set:
      global:
        clusterConfiguration:
          clusterType: "Static"
        enabledModules:
        - infra-provider-other

    asserts:
      - equal:
          path: "test"
          value: "not empty string"

  - it: should return empty string in case of Static cluster with infra-provider substring not at prefix
    set:
      global:
        clusterConfiguration:
          clusterType: "Static"
        enabledModules:
        - foo-infra-provider-x
        - node-manager

    asserts:
      - notEqual:
          path: "test"
          value: "not empty string"

  - it: should return empty string in case of Static cluster with only unrelated modules
    set:
      global:
        clusterConfiguration:
          clusterType: "Static"
        enabledModules:
        - node-manager

    asserts:
      - notEqual:
          path: "test"
          value: "not empty string"

  - it: should return not empty string in case of Cloud cluster with infra-provider-baremetal enabled
    set:
      global:
        clusterConfiguration:
          clusterType: "Cloud"
        enabledModules:
        - infra-provider-baremetal

    asserts:
      - equal:
          path: "test"
          value: "not empty string"
