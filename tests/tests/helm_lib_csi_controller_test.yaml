suite: helm_lib_csi_controller_value definition
templates:
  - helm_lib_csi_controller_value.yaml
tests:
  - it: renders csi controller manifests

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiExternalAttacher125: csiControllerAttacher125
              csiExternalProvisioner125: csiControllerProvisioner125
              csiExternalResizer125: csiControllerResizer125
              csiExternalSnapshotter125: csiControllerSnapshotter125
              csiLivenessprobe125: csiLivenessProbe125
        discovery:
          kubernetesVersion: "1.25"
          d8SpecificNodeCountByRole: {}
      _testvalues:
        controllerImage: controllerImage
        syncerEnabled: "true"
        syncerImage: "deckhouse.io/deckhouse/ce@csiControllerSyncer125"

    documentSelector:
      path: kind
      value: Deployment

    asserts:
      - hasDocuments:
          count: 2

      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: csi-controller
          namespace: d8-test-module

      - equal:
          path: spec.template.spec.dnsPolicy
          value: "ClusterFirstWithHostNet"

      - equal:
          path: spec.template.spec.containers[0].image
          value: "deckhouse.io/deckhouse/ce@csiControllerProvisioner125"

      - equal:
          path: spec.template.spec.containers[1].image
          value: "deckhouse.io/deckhouse/ce@csiControllerAttacher125"

      - equal:
          path: spec.template.spec.containers[2].image
          value: "deckhouse.io/deckhouse/ce@csiControllerResizer125"

      - equal:
          path: spec.template.spec.containers[3].image
          value: "deckhouse.io/deckhouse/ce@csiControllerSyncer125"

      - equal:
          path: spec.template.spec.containers[4].image
          value: "deckhouse.io/deckhouse/ce@csiControllerSnapshotter125"

      - equal:
          path: spec.template.spec.containers[5].image
          value: "deckhouse.io/deckhouse/ce@csiLivenessProbe125"

      - equal:
          path: spec.template.spec.containers[6].image
          value: "controllerImage"

  - it: renders csi controller manifests with dnsPolicy defined

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiExternalAttacher125: csiControllerAttacher125
              csiExternalProvisioner125: csiControllerProvisioner125
              csiExternalResizer125: csiControllerResizer125
              csiExternalSnapshotter125: csiControllerSnapshotter125
              csiLivenessprobe125: csiLivenessProbe125
        discovery:
          kubernetesVersion: "1.25"
          d8SpecificNodeCountByRole: {}
      _testvalues:
        controllerImage: controllerImage
        dnsPolicy: Default

    documentSelector:
      path: kind
      value: Deployment

    asserts:
      - hasDocuments:
          count: 2

      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: csi-controller
          namespace: d8-test-module

      - equal:
          path: spec.template.spec.dnsPolicy
          value: "Default"

  - it: renders csi controller manifests with no dnsPolicy when hostNetwork is false

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiExternalAttacher125: csiControllerAttacher125
              csiExternalProvisioner125: csiControllerProvisioner125
              csiExternalResizer125: csiControllerResizer125
              csiExternalSnapshotter125: csiControllerSnapshotter125
              csiLivenessprobe125: csiLivenessProbe125
        discovery:
          kubernetesVersion: "1.25"
          d8SpecificNodeCountByRole: {}
      _testvalues:
        controllerImage: controllerImage
        csiControllerHostNetwork: "false"
        dnsPolicy: Default

    documentSelector:
      path: kind
      value: Deployment

    asserts:
      - hasDocuments:
          count: 2

      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: csi-controller
          namespace: d8-test-module

      - notExists:
          path: spec.template.spec.dnsPolicy

  - it: renders csi controller manifests with liveness probe timeout

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiExternalAttacher125: csiControllerAttacher125
              csiExternalProvisioner125: csiControllerProvisioner125
              csiExternalResizer125: csiControllerResizer125
              csiExternalSnapshotter125: csiControllerSnapshotter125
              csiLivenessprobe125: csiLivenessProbe125
        discovery:
          kubernetesVersion: "1.25"
          d8SpecificNodeCountByRole: {}
      _testvalues:
        controllerImage: controllerImage
        dnsPolicy: Default
        livenessProbeInitialDelaySeconds: 10
        livenessProbeTimeoutSeconds: 10
    documentSelector:
      path: kind
      value: Deployment

    asserts:
      - hasDocuments:
          count: 2

      - containsDocument:
          kind: Deployment
          apiVersion: apps/v1
          name: csi-controller
          namespace: d8-test-module

      - equal:
          path: spec.template.spec.containers[4].args[1]
          value: "--probe-timeout=10s"
      - equal:
          path: spec.template.spec.containers[5].livenessProbe.initialDelaySeconds
          value: 10
      - equal:
          path: spec.template.spec.containers[5].livenessProbe.timeoutSeconds
          value: 10

  - it: renders VPA container policy ceilings when vertical-pod-autoscaler-crd is present

    set:
      global:
        enabledModules:
          - vertical-pod-autoscaler-crd
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiExternalAttacher125: csiControllerAttacher125
              csiExternalProvisioner125: csiControllerProvisioner125
              csiExternalResizer125: csiControllerResizer125
              csiExternalSnapshotter125: csiControllerSnapshotter125
              csiLivenessprobe125: csiLivenessProbe125
        discovery:
          kubernetesVersion: "1.25"
          d8SpecificNodeCountByRole: {}
      _testvalues:
        controllerImage: controllerImage

    asserts:
      - hasDocuments:
          count: 3
      - isKind:
          of: VerticalPodAutoscaler
        documentIndex: 0

      # Every memory ceiling is a multiple of 64Mi, the recommender's rounding quantum.
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].containerName
          value: provisioner
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].maxAllowed
          value:
            cpu: 50m
            memory: 128Mi
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[1].containerName
          value: attacher
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[1].maxAllowed
          value:
            cpu: 50m
            memory: 128Mi
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[2].containerName
          value: resizer
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[2].maxAllowed
          value:
            cpu: 50m
            memory: 128Mi
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[3].containerName
          value: snapshotter
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[3].maxAllowed
          value:
            cpu: 50m
            memory: 128Mi
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[4].containerName
          value: livenessprobe
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[4].maxAllowed
          value:
            cpu: 25m
            memory: 64Mi
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[5].containerName
          value: controller
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[5].maxAllowed
          value:
            cpu: 100m
            memory: 256Mi
        documentIndex: 0
