suite: helm_lib_module_controller_manifests definition
templates:
  - helm_lib_module_controller_manifests.yaml
tests:
  - it: renders PDB manifest
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
        highAvailability: true
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true

    asserts:
      - hasDocuments:
          count: 2

      - isKind:
          of: PodDisruptionBudget
        documentIndex: 0

      - equal:
          path: metadata.name
          value: controller
        documentIndex: 0

      - equal:
          path: spec.minAvailable
          value: 1
        documentIndex: 0

      - isKind:
          of: Deployment
        documentIndex: 1

  - it: renders VPA when vertical-pod-autoscaler-crd is enabled
    set:
      global:
        enabledModules:
          - vertical-pod-autoscaler-crd
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true

    asserts:
      - hasDocuments:
          count: 3

      - isKind:
          of: VerticalPodAutoscaler
        documentIndex: 0

      - equal:
          path: metadata.name
          value: controller
        documentIndex: 0

      - equal:
          path: spec.updatePolicy.updateMode
          value: InPlaceOrRecreate
        documentIndex: 0

      - equal:
          path: spec.resourcePolicy.containerPolicies[0].containerName
          value: controller
        documentIndex: 0

      - isKind:
          of: PodDisruptionBudget
        documentIndex: 1

      - isKind:
          of: Deployment
        documentIndex: 2

  - it: renders VPA with webhooks container policy when webhook is enabled
    set:
      global:
        enabledModules:
          - vertical-pod-autoscaler-crd
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
              webhooks: sha256:def456
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
        internal:
          customWebhookCert:
            ca: test-ca-cert
            crt: test-crt
            key: test-key
      _testvalues:
        valuesKey: testModule
        webhookEnabled: true
        webhookCertPath: internal.customWebhookCert
        onMasterNode: true

    asserts:
      - hasDocuments:
          count: 3

      - isKind:
          of: VerticalPodAutoscaler
        documentIndex: 0

      - lengthEqual:
          path: spec.resourcePolicy.containerPolicies
          count: 2
        documentIndex: 0

      - equal:
          path: spec.resourcePolicy.containerPolicies[0].containerName
          value: controller
        documentIndex: 0

      - equal:
          path: spec.resourcePolicy.containerPolicies[1].containerName
          value: webhooks
        documentIndex: 0

      # Every memory ceiling is a multiple of 64Mi, the recommender's rounding quantum.
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].maxAllowed
          value:
            cpu: 200m
            memory: 256Mi
        documentIndex: 0

      - equal:
          path: spec.resourcePolicy.containerPolicies[1].maxAllowed
          value:
            cpu: 25m
            memory: 128Mi
        documentIndex: 0

  - it: passes LOG_LEVEL to the webhooks container
    set:
      global:
        enabledModules:
          - vertical-pod-autoscaler-crd
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
              webhooks: sha256:def456
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: DEBUG
        internal:
          customWebhookCert:
            ca: test-ca-cert
            crt: test-crt
            key: test-key
      _testvalues:
        valuesKey: testModule
        webhookEnabled: true
        webhookCertPath: internal.customWebhookCert
        onMasterNode: true

    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: webhooks
        documentIndex: 2

      # The same numeric contract the controller container gets: 0..4, not the
      # ERROR..TRACE spelling of the module values.
      - equal:
          path: spec.template.spec.containers[1].env
          value:
            - name: LOG_LEVEL
              value: "3"
        documentIndex: 2

  - it: appends additionalWebhooksEnvs after LOG_LEVEL
    set:
      global:
        enabledModules:
          - vertical-pod-autoscaler-crd
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
              webhooks: sha256:def456
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
        internal:
          customWebhookCert:
            ca: test-ca-cert
            crt: test-crt
            key: test-key
      _testvalues:
        valuesKey: testModule
        webhookEnabled: true
        webhookCertPath: internal.customWebhookCert
        onMasterNode: true
        additionalWebhooksEnvs:
          - name: WEBHOOK_FEATURE_FLAG
            value: "on"
          - name: POD_NAMESPACE
            valueFrom:
              fieldRef:
                fieldPath: metadata.namespace

    asserts:
      - equal:
          path: spec.template.spec.containers[1].env
          value:
            - name: LOG_LEVEL
              value: "2"
            - name: WEBHOOK_FEATURE_FLAG
              value: "on"
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
        documentIndex: 2

  - it: puts a kube-rbac-proxy in front of the metrics port
    set:
      global:
        enabledModules:
          - vertical-pod-autoscaler-crd
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
            common:
              kubeRbacProxy: sha256:krp789
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true
        controllerMetricsPort: 8080
        controllerMetricsProxyPort: 4207

    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: kube-rbac-proxy
        documentIndex: 2

      # The proxy listens on the pod IP, the controller keeps its port on loopback.
      - equal:
          path: spec.template.spec.containers[1].ports
          value:
            - name: https-metrics
              containerPort: 4207
              protocol: TCP
        documentIndex: 2

      - contains:
          path: spec.template.spec.containers[1].args
          content: "--secure-listen-address=$(KUBE_RBAC_PROXY_LISTEN_ADDRESS):4207"
        documentIndex: 2

      # Scraping goes through an authorization check, not through an open port.
      - matchRegex:
          path: spec.template.spec.containers[1].env[1].value
          pattern: "upstream: http://127.0.0.1:8080/metrics"
        documentIndex: 2

      - matchRegex:
          path: spec.template.spec.containers[1].env[1].value
          pattern: "subresource: prometheus-metrics"
        documentIndex: 2

  - it: keeps the plain metrics port undeclared while the proxy fronts it
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
            common:
              kubeRbacProxy: sha256:krp789
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true
        controllerMetricsPort: 8080
        controllerMetricsProxyPort: 4207

    asserts:
      # A declared containerPort would advertise an endpoint that answers without
      # authentication; the controller binds it on 127.0.0.1 for the proxy alone.
      - isNull:
          path: spec.template.spec.containers[0].ports
        documentIndex: 1

  - it: declares the metrics port directly when no proxy is configured
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true
        controllerMetricsPort: 8080

    asserts:
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: metrics
              containerPort: 8080
              protocol: TCP
        documentIndex: 1

      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
        documentIndex: 1

  - it: gives the proxy container a VPA policy of its own
    set:
      global:
        enabledModules:
          - vertical-pod-autoscaler-crd
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
            common:
              kubeRbacProxy: sha256:krp789
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true
        controllerMetricsPort: 8080
        controllerMetricsProxyPort: 4207

    asserts:
      # Without a policy the recommender would size the sidecar from scratch on
      # every module; this is the shared one, ceilings included -- the memory ceiling
      # is a multiple of the recommender's 64Mi rounding quantum.
      - equal:
          path: spec.resourcePolicy.containerPolicies[1]
          value:
            containerName: kube-rbac-proxy
            minAllowed:
              cpu: 10m
              memory: 25Mi
            maxAllowed:
              cpu: 25m
              memory: 64Mi
        documentIndex: 0

  - it: binds the controller metrics on loopback when a proxy fronts them
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
            common:
              kubeRbacProxy: sha256:krp789
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true
        controllerMetricsPort: 8080
        controllerMetricsProxyPort: 4207

    asserts:
      # Dropping the containerPort is not what keeps the endpoint off the pod IP --
      # containerPort is metadata. This env is.
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_BIND_ADDRESS
            value: "127.0.0.1:8080"
        documentIndex: 1

      # A metrics sidecar must not be able to take the pod out of its Services'
      # endpoints, so it carries no readinessProbe.
      - notExists:
          path: spec.template.spec.containers[1].readinessProbe
        documentIndex: 1

      - exists:
          path: spec.template.spec.containers[1].livenessProbe
        documentIndex: 1

  - it: binds the controller metrics on the pod IP when nothing fronts them
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true
        controllerMetricsPort: 8080

    asserts:
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_BIND_ADDRESS
            value: ":8080"
        documentIndex: 1

  - it: emits no METRICS_BIND_ADDRESS when the module declares no metrics port
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true

    asserts:
      - notContains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_BIND_ADDRESS
            value: ":8080"
        documentIndex: 1

  - it: keeps the cpu and memory requests of every container when vertical-pod-autoscaler-crd is enabled
    set:
      global:
        enabledModules:
          - vertical-pod-autoscaler-crd
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
              webhooks: sha256:def456
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
        internal:
          customWebhookCert:
            ca: test-ca-cert
            crt: test-crt
            key: test-key
      _testvalues:
        valuesKey: testModule
        webhookEnabled: true
        webhookCertPath: internal.customWebhookCert
        onMasterNode: true

    # A pod without them is BestEffort, which the VPA updater cannot resize in
    # place, so it evicts the pod instead, again and again while the admission
    # controller does not set them.
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 10m
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 25Mi
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[1].resources.requests.cpu
          value: 10m
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.template.spec.containers[1].resources.requests.memory
          value: 50Mi
        documentSelector:
          path: kind
          value: Deployment

  - it: runs two replicas on masters in HA mode on a cluster with three masters
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
        discovery:
          clusterMasterCount: 3
          d8SpecificNodeCountByRole:
            master: 3
        highAvailability: true
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true
    asserts:
      - equal:
          path: spec.replicas
          value: 2
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
        documentSelector:
          path: kind
          value: Deployment

  - it: runs two replicas on masters in HA mode when only the master role count is known
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
        discovery:
          d8SpecificNodeCountByRole:
            master: 5
        highAvailability: true
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true
    asserts:
      - equal:
          path: spec.replicas
          value: 2
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
        documentSelector:
          path: kind
          value: Deployment

  - it: runs one replica on masters in HA mode on a cluster with one master
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
        discovery:
          clusterMasterCount: 1
          d8SpecificNodeCountByRole:
            master: 1
        highAvailability: true
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
        documentSelector:
          path: kind
          value: Deployment

  - it: runs one replica on masters when high availability is off
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
        discovery:
          clusterMasterCount: 3
          d8SpecificNodeCountByRole:
            master: 3
        highAvailability: false
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true
    asserts:
      - equal:
          path: spec.replicas
          value: 1
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
        documentSelector:
          path: kind
          value: Deployment

  - it: keeps two replicas off masters in HA mode
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
        discovery:
          clusterMasterCount: 3
          d8SpecificNodeCountByRole:
            master: 3
        highAvailability: true
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: false
    asserts:
      - equal:
          path: spec.replicas
          value: 2
        documentSelector:
          path: kind
          value: Deployment
      - equal:
          path: spec.strategy
          value:
            type: RollingUpdate
            rollingUpdate:
              maxSurge: 0
              maxUnavailable: 1
        documentSelector:
          path: kind
          value: Deployment

  - it: serves the metrics from the controller without a kube-rbac-proxy when authorization is in process
    set:
      global:
        enabledModules:
          - vertical-pod-autoscaler-crd
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
            common:
              kubeRbacProxy: sha256:krp789
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true
        controllerMetricsPort: 8080
        controllerMetricsProxyPort: 4207
        controllerMetricsInProcessAuthorization: true

    asserts:
      - lengthEqual:
          path: spec.template.spec.containers
          count: 1
        documentIndex: 2
      - equal:
          path: spec.template.spec.containers[0].ports
          value:
            - name: https-metrics
              containerPort: 4207
              protocol: TCP
        documentIndex: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_BIND_ADDRESS
            value: ":4207"
        documentIndex: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_AUTHORIZATION_NAMESPACE
            value: d8-test-module
        documentIndex: 2
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_AUTHORIZATION_DEPLOYMENT
            value: controller
        documentIndex: 2
      - notContains:
          path: spec.resourcePolicy.containerPolicies
          content:
            containerName: kube-rbac-proxy
          any: true
        documentIndex: 0

  - it: keeps the kube-rbac-proxy when in-process authorization is off
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
            common:
              kubeRbacProxy: sha256:krp789
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
      _testvalues:
        valuesKey: testModule
        webhookEnabled: false
        onMasterNode: true
        controllerMetricsPort: 8080
        controllerMetricsProxyPort: 4207
        controllerMetricsInProcessAuthorization: false

    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: kube-rbac-proxy
        documentIndex: 1
      - contains:
          path: spec.template.spec.containers[0].env
          content:
            name: METRICS_BIND_ADDRESS
            value: "127.0.0.1:8080"
        documentIndex: 1

  - it: passes controllerArgs to the controller container
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
              webhooks: sha256:def456
            common:
              kubeRbacProxy: sha256:krp789
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
        internal:
          customWebhookCert:
            ca: test-ca-cert
            crt: test-crt
            key: test-key
      _testvalues:
        valuesKey: testModule
        onMasterNode: false
        webhookEnabled: false
        controllerArgs:
          - --api-addr=:8443
          - --api-tls-cert=/etc/tls/tls.crt
    asserts:
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - --api-addr=:8443
            - --api-tls-cert=/etc/tls/tls.crt
        documentSelector:
          path: kind
          value: Deployment

  - it: renders no args when controllerArgs is not set
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
              webhooks: sha256:def456
            common:
              kubeRbacProxy: sha256:krp789
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
        internal:
          customWebhookCert:
            ca: test-ca-cert
            crt: test-crt
            key: test-key
      _testvalues:
        valuesKey: testModule
        onMasterNode: false
        webhookEnabled: false
    asserts:
      - notExists:
          path: spec.template.spec.containers[0].args
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.metadata.annotations
        documentSelector:
          path: kind
          value: Deployment
      - notExists:
          path: spec.template.spec.containers[0].ports
        documentSelector:
          path: kind
          value: Deployment

  - it: adds additionalControllerPorts after the in-process metrics port
    set:
      global:
        enabledModules: []
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            testModule:
              controller: sha256:abc123
              webhooks: sha256:def456
            common:
              kubeRbacProxy: sha256:krp789
        discovery:
          d8SpecificNodeCountByRole:
            master: 3
      testModule:
        logLevel: INFO
        internal:
          customWebhookCert:
            ca: test-ca-cert
            crt: test-crt
            key: test-key
      _testvalues:
        valuesKey: testModule
        onMasterNode: false
        webhookEnabled: false
        controllerMetricsPort: 8080
        controllerMetricsProxyPort: 4207
        controllerMetricsInProcessAuthorization: true
        additionalControllerPorts:
          - name: https
            containerPort: 8443
