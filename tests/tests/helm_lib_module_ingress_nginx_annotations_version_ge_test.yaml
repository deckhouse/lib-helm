suite: helm_lib_module_ingress_nginx_annotations_version_ge definition
templates:
  - helm_lib_module_ingress_nginx_annotations_version_ge.yaml
tests:
  - it: renders an empty string when global.discovery is missing
    asserts:
      - equal:
          path: ge
          value: ""

  - it: renders an empty string when the version is not discovered
    set:
      global:
        discovery:
          clusterDomain: cluster.local
    asserts:
      - equal:
          path: ge
          value: ""

  - it: renders an empty string when global.discovery is null
    set:
      global:
        discovery: null
    asserts:
      - equal:
          path: ge
          value: ""

  - it: renders an empty string when global.discovery is not a map
    set:
      global:
        discovery: not-a-map
    asserts:
      - equal:
          path: ge
          value: ""

  - it: renders an empty string when the discovered version is null
    set:
      global:
        discovery:
          ingressNginxAnnotationsVersion: null
    asserts:
      - equal:
          path: ge
          value: ""

  - it: renders an empty string when the discovered version is empty
    set:
      global:
        discovery:
          ingressNginxAnnotationsVersion: ""
    asserts:
      - equal:
          path: ge
          value: ""

  - it: renders an empty string when the discovered version is not a semver
    set:
      global:
        discovery:
          ingressNginxAnnotationsVersion: not-a-version
    asserts:
      - equal:
          path: ge
          value: ""

  - it: renders an empty string when the discovered version is lower
    set:
      global:
        discovery:
          ingressNginxAnnotationsVersion: 1.2.0
    asserts:
      - equal:
          path: ge
          value: ""

  - it: renders "true" when the discovered version is equal
    set:
      global:
        discovery:
          ingressNginxAnnotationsVersion: 1.2.1
    asserts:
      - equal:
          path: ge
          value: "true"

  - it: renders "true" when the discovered patch version is greater
    set:
      global:
        discovery:
          ingressNginxAnnotationsVersion: 1.2.2
    asserts:
      - equal:
          path: ge
          value: "true"

  - it: renders "true" when the discovered minor version is greater
    set:
      global:
        discovery:
          ingressNginxAnnotationsVersion: 1.3.0
    asserts:
      - equal:
          path: ge
          value: "true"

  - it: renders "true" when the discovered major version is greater
    set:
      global:
        discovery:
          ingressNginxAnnotationsVersion: 2.0.0
    asserts:
      - equal:
          path: ge
          value: "true"

  - it: accepts a discovered version with a leading v
    set:
      global:
        discovery:
          ingressNginxAnnotationsVersion: v1.3.0
    asserts:
      - equal:
          path: ge
          value: "true"

  - it: accepts a minimal version with a leading v
    set:
      minimal: v1.2.1
      global:
        discovery:
          ingressNginxAnnotationsVersion: 1.2.1
    asserts:
      - equal:
          path: ge
          value: "true"

  - it: compares against the minimal version passed in
    set:
      minimal: 1.4.0
      global:
        discovery:
          ingressNginxAnnotationsVersion: 1.3.0
    asserts:
      - equal:
          path: ge
          value: ""

  - it: renders an empty string for a pre-release of a greater version
    set:
      global:
        discovery:
          ingressNginxAnnotationsVersion: 1.3.0-rc.1
    asserts:
      - equal:
          path: ge
          value: ""

  - it: fails when the minimal version is not a semver
    set:
      minimal: not-a-version
      global:
        discovery:
          ingressNginxAnnotationsVersion: 1.3.0
    asserts:
      - failedTemplate:
          errorMessage: 'helm_lib_module_ingress_nginx_annotations_version_ge: "not-a-version" is not a semver'
