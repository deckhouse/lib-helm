suite: helm_lib_csi_node_value definition
templates:
  - helm_lib_csi_node_value.yaml
tests:
  - it: renders initContainer when data provided

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        additionalNodeEnvs:
          - name: testEnv
            value: testValue
        additionalNodeArgs:
          - --start
        additionalNodeVolumes: {}
        additionalNodeVolumeMounts: {}
        initContainers:
          - name: init-container-name
            command:
              - command
            imagePullPolicy: IfNotPresent
            image: initContainerImage

    asserts:
      - containsDocument:
          kind: DaemonSet
          apiVersion: apps/v1
          name: csi-node
          namespace: d8-test-module

      - equal:
          path: "spec.template.spec.initContainers[0].image"
          value: initContainerImage

      - equal:
          path: "spec.template.spec.initContainers[0].command"
          value:
            - command

      - equal:
          path: "spec.template.spec.initContainers[0].name"
          value: init-container-name

  - it: contains params according values

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        additionalNodeEnvs:
          - name: testEnv
            value: testValue
        additionalNodeArgs:
          - --start
        additionalNodeVolumes: {}
        additionalNodeVolumeMounts: {}
        initContainers:
          - name: init-container-name
            command:
              - command
            imagePullPolicy: IfNotPresent
            image: initContainerImage

    asserts:
      - equal:
          path: "spec.template.spec.initContainers[0].image"
          value: initContainerImage

      - equal:
          path: "spec.template.spec.initContainers[0].command"
          value:
            - command

      - equal:
          path: "spec.template.spec.initContainers[0].name"
          value: init-container-name

  - it: node container sets allowPrivilegeEscalation and drops all capabilities by default
    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        additionalNodeVolumes: {}
        additionalNodeVolumeMounts: {}
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: node
      - equal:
          path: spec.template.spec.containers[1].securityContext.allowPrivilegeEscalation
          value: true
      - equal:
          path: spec.template.spec.containers[1].securityContext.privileged
          value: true
      - equal:
          path: spec.template.spec.containers[1].securityContext.capabilities.drop
          value:
            - ALL
      - notExists:
          path: spec.template.spec.containers[1].securityContext.capabilities.add

  - it: node container adds SYS_ADMIN capability when setSysAdminCapability is true
    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        setSysAdminCapability: true
        additionalNodeVolumes: {}
        additionalNodeVolumeMounts: {}
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: node
      - equal:
          path: spec.template.spec.containers[1].securityContext.allowPrivilegeEscalation
          value: true
      - equal:
          path: spec.template.spec.containers[1].securityContext.capabilities.drop
          value:
            - ALL
      - contains:
          path: spec.template.spec.containers[1].securityContext.capabilities.add
          content: SYS_ADMIN

  - it: renders VPA container policy ceilings when vertical-pod-autoscaler-crd is present

    set:
      global:
        enabledModules:
          - vertical-pod-autoscaler-crd
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN

    asserts:
      - isKind:
          of: VerticalPodAutoscaler
        documentIndex: 0

      # Every memory ceiling is a multiple of 64Mi, the recommender's rounding quantum.
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].containerName
          value: node-driver-registrar
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].maxAllowed
          value:
            cpu: 25m
            memory: 64Mi
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[1].containerName
          value: node
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[1].maxAllowed
          value:
            cpu: 100m
            memory: 128Mi
        documentIndex: 0

  - it: declares no ports on the node container

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN

    asserts:
      - notExists:
          path: spec.template.spec.containers[1].ports

  - it: gives the port probes to the container that serves the port

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        livenessProbePort: 4242
        startupProbeFailureThreshold: 30

    asserts:
      # node-driver-registrar is the container that listens on --http-endpoint,
      # so the probes on that port belong to it. Probing it from the driver
      # container made the driver's life depend on a sibling that exits by
      # design when registration fails, and the two deadlocked: the registrar
      # exited, its port went with it, the probe killed the driver, the CSI
      # socket disappeared, and the restarted registrar could no longer reach it.
      - equal:
          path: spec.template.spec.containers[0].name
          value: node-driver-registrar
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.httpGet.port
          value: 4242
      - equal:
          path: spec.template.spec.containers[0].startupProbe.httpGet.port
          value: 4242
      - equal:
          path: spec.template.spec.containers[1].name
          value: node
      - notExists:
          path: spec.template.spec.containers[1].livenessProbe
      - notExists:
          path: spec.template.spec.containers[1].startupProbe

  - it: prefers an explicit exec liveness command over the served port

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        livenessProbePort: 4242
        additionalNodeLivenessProbesCmd:
          - /probe
          - --check

    asserts:
      # A container takes only one livenessProbe, so a module that supplies its
      # own command keeps it and the httpGet is left out.
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - /probe
            - --check
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
