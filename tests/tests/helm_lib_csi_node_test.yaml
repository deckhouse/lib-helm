suite: helm_lib_csi_node_value definition
templates:
  - helm_lib_csi_node_value.yaml
tests:
  - it: renders initContainer when data provided

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        additionalNodeEnvs:
          - name: testEnv
            value: testValue
        additionalNodeArgs:
          - --start
        additionalNodeVolumes: {}
        additionalNodeVolumeMounts: {}
        initContainers:
          - name: init-container-name
            command:
              - command
            imagePullPolicy: IfNotPresent
            image: initContainerImage

    asserts:
      - containsDocument:
          kind: DaemonSet
          apiVersion: apps/v1
          name: csi-node
          namespace: d8-test-module

      - equal:
          path: "spec.template.spec.initContainers[0].image"
          value: initContainerImage

      - equal:
          path: "spec.template.spec.initContainers[0].command"
          value:
            - command

      - equal:
          path: "spec.template.spec.initContainers[0].name"
          value: init-container-name

  - it: contains params according values

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        additionalNodeEnvs:
          - name: testEnv
            value: testValue
        additionalNodeArgs:
          - --start
        additionalNodeVolumes: {}
        additionalNodeVolumeMounts: {}
        initContainers:
          - name: init-container-name
            command:
              - command
            imagePullPolicy: IfNotPresent
            image: initContainerImage

    asserts:
      - equal:
          path: "spec.template.spec.initContainers[0].image"
          value: initContainerImage

      - equal:
          path: "spec.template.spec.initContainers[0].command"
          value:
            - command

      - equal:
          path: "spec.template.spec.initContainers[0].name"
          value: init-container-name

  - it: node container sets allowPrivilegeEscalation and drops all capabilities by default
    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        additionalNodeVolumes: {}
        additionalNodeVolumeMounts: {}
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: node
      - equal:
          path: spec.template.spec.containers[1].securityContext.allowPrivilegeEscalation
          value: true
      - equal:
          path: spec.template.spec.containers[1].securityContext.privileged
          value: true
      - equal:
          path: spec.template.spec.containers[1].securityContext.capabilities.drop
          value:
            - ALL
      - notExists:
          path: spec.template.spec.containers[1].securityContext.capabilities.add

  - it: node container adds SYS_ADMIN capability when setSysAdminCapability is true
    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        setSysAdminCapability: true
        additionalNodeVolumes: {}
        additionalNodeVolumeMounts: {}
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: node
      - equal:
          path: spec.template.spec.containers[1].securityContext.allowPrivilegeEscalation
          value: true
      - equal:
          path: spec.template.spec.containers[1].securityContext.capabilities.drop
          value:
            - ALL
      - contains:
          path: spec.template.spec.containers[1].securityContext.capabilities.add
          content: SYS_ADMIN

  - it: renders VPA container policy ceilings when vertical-pod-autoscaler-crd is present

    set:
      global:
        enabledModules:
          - vertical-pod-autoscaler-crd
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN

    asserts:
      - isKind:
          of: VerticalPodAutoscaler
        documentIndex: 0

      # Every memory ceiling is a multiple of 64Mi, the recommender's rounding quantum.
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].containerName
          value: node-driver-registrar
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[0].maxAllowed
          value:
            cpu: 25m
            memory: 64Mi
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[1].containerName
          value: node
        documentIndex: 0
      - equal:
          path: spec.resourcePolicy.containerPolicies[1].maxAllowed
          value:
            cpu: 100m
            memory: 128Mi
        documentIndex: 0

  - it: declares no ports on the node container

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN

    asserts:
      - notExists:
          path: spec.template.spec.containers[1].ports

  - it: declares additionalNodePorts on the node container

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        additionalNodePorts:
          - name: https-metrics
            containerPort: 4271
            protocol: TCP

    asserts:
      - equal:
          path: spec.template.spec.containers[1].name
          value: node
      - equal:
          path: spec.template.spec.containers[1].ports
          value:
            - name: https-metrics
              containerPort: 4271
              protocol: TCP
      - notExists:
          path: spec.template.spec.containers[0].ports

  - it: ignores livenessProbePort and startupProbeFailureThreshold of the node plugin

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        livenessProbePort: 4242
        startupProbeFailureThreshold: 30
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].name
          value: node-driver-registrar
      - equal:
          path: spec.template.spec.containers[0].args
          value:
            - "--v=2"
            - "--csi-address=$(CSI_ENDPOINT)"
            - "--kubelet-registration-path=$(DRIVER_REG_SOCK_PATH)"
      - notExists:
          path: spec.template.spec.containers[0].ports
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe
      - notExists:
          path: spec.template.spec.containers[0].startupProbe
      - equal:
          path: spec.template.spec.containers[1].name
          value: node
      - notExists:
          path: spec.template.spec.containers[1].livenessProbe
      - notExists:
          path: spec.template.spec.containers[1].startupProbe
      - matchSnapshot:
          path: spec.template.spec.containers[0]

  - it: gives node-driver-registrar the exec liveness command the module supplies

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN
        livenessProbePort: 4242
        additionalNodeLivenessProbesCmd:
          - /probe
          - --check
    documentSelector:
      path: kind
      value: DaemonSet
    asserts:
      - equal:
          path: spec.template.spec.containers[0].livenessProbe.exec.command
          value:
            - /probe
            - --check
      - notExists:
          path: spec.template.spec.containers[0].livenessProbe.httpGet
      - notContains:
          path: spec.template.spec.containers[0].args
          content: "--http-endpoint=:4242"

  - it: passes the module logLevel to node-driver-registrar as klog verbosity

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      testModule:
        logLevel: TRACE
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN

    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--v=5"

  - it: renders node-driver-registrar at klog verbosity 2 when the module sets no logLevel

    set:
      global:
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN

    asserts:
      - contains:
          path: spec.template.spec.containers[0].args
          content: "--v=2"

  - it: keeps the cpu and memory requests of every container when vertical-pod-autoscaler-crd is present

    set:
      global:
        enabledModules:
          - vertical-pod-autoscaler-crd
        modules:
          placement: {}
        modulesImages:
          registry:
            base: "deckhouse.io/deckhouse/ce"
          digests:
            common:
              csiNodeDriverRegistrar125: csiNodeDriverRegistrar125
        discovery:
          kubernetesVersion: "1.25"
      _testvalues:
        forceCsiNodeAndStaticNodesDepoloy: true
        nodeImage: nodeImage
        driverFQDN: driverFQDN

    # A pod without them is BestEffort, which the VPA updater cannot resize in
    # place, so it evicts the pod instead, again and again while the admission
    # controller does not set them.
    asserts:
      - equal:
          path: spec.template.spec.containers[0].resources.requests.cpu
          value: 12m
        documentSelector:
          path: kind
          value: DaemonSet
      - equal:
          path: spec.template.spec.containers[0].resources.requests.memory
          value: 25Mi
        documentSelector:
          path: kind
          value: DaemonSet
      - exists:
          path: spec.template.spec.containers[1].resources.requests.cpu
        documentSelector:
          path: kind
          value: DaemonSet
      - exists:
          path: spec.template.spec.containers[1].resources.requests.memory
        documentSelector:
          path: kind
          value: DaemonSet
