suite: helm_lib_pod_anti_affinity_for_ha definition
templates:
  - helm_lib_pod_anti_affinity_for_ha.yaml
tests:
  - it: should return pod anti-affinity when HA is enabled
    set:
      Chart:
        Name: "testModule"
      global:
        highAvailability: true
    asserts:
      - notEqual:
          path: result
          value: ""
      - matchRegex:
          path: result
          pattern: "affinity:"
      - matchRegex:
          path: result
          pattern: 'app: "test"'
      - notMatchRegex:
          path: result
          pattern: "matchLabelKeys:"
      - matchRegex:
          path: revisionScopedResult
          pattern: "matchLabelKeys:"
      - matchRegex:
          path: revisionScopedResult
          pattern: "pod-template-hash"

  - it: should return empty when HA is disabled
    set:
      Chart:
        Name: "testModule"
      global:
        highAvailability: false
    asserts:
      - equal:
          path: result
          value: ""
      - equal:
          path: revisionScopedResult
          value: ""